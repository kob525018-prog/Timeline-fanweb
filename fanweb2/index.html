<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Love Timeline</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body>
    <div class="falling-hearts" aria-hidden="true"></div>
    <main>
      <header class="hero">
        <!-- แก้ข้อความหัวเว็บได้ที่ script.js: 3 (siteTitle) -->
        <p class="eyebrow">OUR LITTLE STORY</p>
        <h1 id="site-title"></h1>
        <p class="intro">ເຮົາເດີນທາງມານຳກັນແລ້ວ</p>
        <div class="love-counter" aria-label="ระยะเวลาที่คบกัน">
          <div><strong id="years">0</strong><span>ປີ</span></div>
          <div><strong id="months">0</strong><span>ເດືອນ</span></div>
          <div><strong id="days">0</strong><span>ວັນ</span></div>
          <div><strong id="hours">0</strong><span>ຊົ່ວໂມງ</span></div>
          <div><strong id="minutes">0</strong><span>ນາທີ</span></div>
          <div><strong id="seconds">0</strong><span>ວິນາທີ</span></div>
        </div>
        <p class="counter-note">ແລະຍັງນັບຕໍ່ໄປເລື້ອຍ ໆ ♡</p>
      </header>

      <section class="timeline-section" aria-label="ไทม์ไลน์ความทรงจำ">
        <svg class="timeline-line" viewBox="0 0 100 1000" preserveAspectRatio="none" aria-hidden="true">
          <path d="M50 0 C20 75, 82 125, 50 205 S18 315, 51 402 S85 510, 48 600 S20 720, 52 800 S83 910, 48 1000" />
        </svg>
        <div class="timeline" id="timeline"></div>
      </section>
    </main>

    <div class="memory-modal" id="memory-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="close-modal" id="close-modal" aria-label="ปิด">×</button>
      <article class="modal-card">
        <span class="tape tape-large"></span>
        <div class="modal-photo photo-placeholder" id="modal-photo"></div>
        <p class="modal-date" id="modal-date"></p>
        <h2 id="modal-title"></h2>
        <p id="modal-description"></p>
      </article>
    </div>
    <script src="script.js?v=2"></script>
  </body>
</html>
